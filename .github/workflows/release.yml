name: Build Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true `
            -p:Version=$version `
            -p:AssemblyVersion="$version.0" `
            -p:FileVersion="$version.0" `
            -p:InformationalVersion="${{ github.ref_name }}" `
            -o publish

      - name: Zip app
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath WindowsGsmPluginSearch-win-x64.zip

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = Get-FileHash WindowsGsmPluginSearch-win-x64.zip -Algorithm SHA256
          "$($hash.Hash)  WindowsGsmPluginSearch-win-x64.zip" | Out-File SHA256SUMS.txt -Encoding ascii

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WindowsGsmPluginSearch-win-x64.zip
            SHA256SUMS.txt
