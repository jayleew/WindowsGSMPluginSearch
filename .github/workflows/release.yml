name: Build Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v1.0.0"
        required: true
        default: "v1.0.0"
  release:
    types:
      - published
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"

          if ("${{ github.event_name }}" -eq "release") {
            $tag = "${{ github.event.release.tag_name }}"
          }

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.tag }}"
          }

          $version = $tag.TrimStart("v")
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:AssemblyVersion="${{ steps.version.outputs.version }}.0" `
            -p:FileVersion="${{ steps.version.outputs.version }}.0" `
            -p:InformationalVersion=${{ steps.version.outputs.tag }} `
            -o publish

      - name: Zip app
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath WindowsGsmPluginSearch-win-x64.zip

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = Get-FileHash WindowsGsmPluginSearch-win-x64.zip -Algorithm SHA256
          "$($hash.Hash)  WindowsGsmPluginSearch-win-x64.zip" | Out-File SHA256SUMS.txt -Encoding ascii

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            WindowsGsmPluginSearch-win-x64.zip
            SHA256SUMS.txt
